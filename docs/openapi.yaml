openapi: 3.1.0
info:
  title: theserver API
  version: "1"
  description: |
    API v1 of theserver, the local venue server of CYB3RGUN. Every request
    except GET /openapi.yaml carries an admin token as a bearer token
    (D-025); a package download also takes the token of an approved device
    (D-038). A missing or unknown token is answered with 401, a revoked one
    with 403. Timestamps are unix milliseconds in UTC (D-014); 0 means not
    set. Errors always have the shape of the Error schema.
servers:
  - url: /api/v1
security:
  - adminToken: []
paths:
  /devices:
    get:
      summary: List every device with its link state.
      operationId: listDevices
      responses:
        "200":
          description: The devices, ordered by id.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /devices/{id}:
    get:
      summary: Read one device.
      operationId: getDevice
      parameters: [{$ref: "#/components/parameters/DeviceID"}]
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /devices/{id}/approve:
    post:
      summary: Approve a device, so it may connect.
      operationId: approveDevice
      parameters: [{$ref: "#/components/parameters/DeviceID"}]
      responses:
        "200":
          description: The device after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /devices/{id}/block:
    post:
      summary: Block a device and drop its live connection.
      description: The connection gets err unauthorized and is closed; new connections are refused with 401.
      operationId: blockDevice
      parameters: [{$ref: "#/components/parameters/DeviceID"}]
      responses:
        "200":
          description: The device after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /devices/{id}/reset:
    post:
      summary: Start a new sequence epoch for a device (D-026).
      description: |
        The device begins at seq 1 again; the events of earlier epochs stay.
        Its live connection is closed with WebSocket status 1012; the device
        reconnects and learns the new epoch from the ep key of welcome.
      operationId: resetDevice
      parameters: [{$ref: "#/components/parameters/DeviceID"}]
      responses:
        "200":
          description: The device with its new epoch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /devices/{id}/token:
    post:
      summary: Replace the token of a device.
      description: |
        The new token is returned this once and only its hash is stored. The
        old token stops working at once: a live connection gets err
        unauthorized and is closed, and new connections with it get 401.
      operationId: newDeviceToken
      parameters: [{$ref: "#/components/parameters/DeviceID"}]
      responses:
        "200":
          description: The new token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NewToken"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /devices/{id}/min_age:
    post:
      summary: Set the age a device is set for (D-039).
      description: |
        A scenario rated above this age cannot be assigned to a session the
        device is in. The age is one of 0, 6, 12, 16 and 18; a new device is
        set for 18. An age below the rating of the scenario a created or
        running session of the device plays is refused with age_rating.
      operationId: setMinAge
      parameters: [{$ref: "#/components/parameters/DeviceID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MinAge"}
      responses:
        "200":
          description: The device after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ContentConflict"}
  /devices/{id}/scenarios:
    get:
      summary: The scenario versions a device holds or held, and the ones its sessions play.
      operationId: deviceScenarios
      parameters: [{$ref: "#/components/parameters/DeviceID"}]
      responses:
        "200":
          description: Holdings by scenario, newest version first, and the assignments of created and running sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceScenarios"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /sessions:
    get:
      summary: List every session, oldest first.
      operationId: listSessions
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      summary: Create a session in state created.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewSession"}
      responses:
        "201":
          description: The new session.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sessions/{id}/start:
    post:
      summary: Move a created session to running.
      operationId: startSession
      parameters: [{$ref: "#/components/parameters/SessionID"}]
      responses:
        "200":
          description: The session after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sessions/{id}/stop:
    post:
      summary: Move a running session to stopped.
      operationId: stopSession
      parameters: [{$ref: "#/components/parameters/SessionID"}]
      responses:
        "200":
          description: The session after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sessions/{id}/devices:
    post:
      summary: Put a device into a session.
      description: |
        Adding a device twice is not an error. A device set for an age below
        the rating of the scenario the session plays is refused with
        age_rating; otherwise the device gets content_available when it does
        not hold that version.
      operationId: addSessionDevice
      parameters: [{$ref: "#/components/parameters/SessionID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionDevice"}
      responses:
        "200":
          description: The session after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ContentConflict"}
  /sessions/{id}/scenario:
    post:
      summary: Assign a published scenario version to a session and announce it (D-038, D-039).
      description: |
        The session has to be created and the version published. No device
        of the session may be set for an age below the rating of the
        scenario. Every device of the session that does not hold the version
        gets content_available at once; a device that is offline gets it
        after its first health report on its next connection.
      operationId: assignScenario
      parameters: [{$ref: "#/components/parameters/SessionID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScenarioAssignment"}
      responses:
        "200":
          description: The session and what every device of it was told.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionAssignment"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ContentConflict"}
  /drafts:
    get:
      summary: The editor drafts, the one changed last first (D-041).
      operationId: listDrafts
      responses:
        "200":
          description: The drafts without their manifests.
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts:
                    type: array
                    items: {$ref: "#/components/schemas/Draft"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      summary: Open a draft, empty or as a copy of a published version.
      description: |
        An empty draft needs an id and a tier; the editor of S01 works in
        the tiers video and interactive. A copy names a published version in
        from; its manifest and its media come with it, and the id of the
        copy is the id of that scenario unless another one is given. The
        draft carries no files table and no version: the server writes both
        when it publishes (D-042).
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewDraft"}
      responses:
        "201":
          description: The new draft with its manifest.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Draft"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /drafts/{id}:
    get:
      summary: One draft with its manifest, its media and its problems.
      operationId: getDraft
      parameters: [{$ref: "#/components/parameters/DraftID"}]
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Draft"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      summary: Change the manifest of a draft with a JSON merge patch.
      description: |
        The body is a JSON merge patch (RFC 7386) on the manifest: a key
        with a value replaces it, a key with null removes it, an array is
        replaced as a whole. The result must fit the scenario model, else
        nothing is stored and the field is named with the code bad_manifest.
        The answer carries the whole draft and, in touched, the problems
        that lie in the parts the change named.
      operationId: patchDraft
      parameters: [{$ref: "#/components/parameters/DraftID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: A JSON merge patch on the manifest.}
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftChanged"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Delete a draft with its media directory.
      operationId: deleteDraft
      parameters: [{$ref: "#/components/parameters/DraftID"}]
      responses:
        "204":
          description: The draft is gone.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /drafts/{id}/media:
    post:
      summary: Upload one media file into a draft (D-045).
      description: |
        The body is multipart/form-data with the file in the field file and
        an optional field name. The server reads the container and the codec
        from the header and takes a clip as MP4 with H.264 or AV1, an
        overlay as WebM with VP8, VP9 or AV1, a sound as Ogg with Vorbis or
        Opus, and a cover as PNG. Anything else is refused with 415 and the
        code bad_media. A file of the same name is replaced. The server
        never decodes media; the duration and the dimensions come from the
        browser with PATCH on the file.
      operationId: uploadDraftMedia
      parameters: [{$ref: "#/components/parameters/DraftID"}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                name: {type: string, description: The name in the media directory.}
      responses:
        "201":
          description: The draft with the file in its media list.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftChanged"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413":
          description: The file is larger than the upload limit; code too_large.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          description: The container or the codec is not one the editor takes; code bad_media.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /drafts/{id}/media/{name}:
    get:
      summary: The media file itself, for the editor to play it.
      description: |
        The file as it was uploaded, with Range, so a video element can seek
        in it. Only an admin token opens it; a draft is not content a device
        can fetch.
      operationId: getDraftMedia
      parameters:
        - {$ref: "#/components/parameters/DraftID"}
        - {$ref: "#/components/parameters/MediaName"}
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          description: The part of the file the Range asked for.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      summary: Keep what the browser measured on a clip.
      operationId: measureDraftMedia
      parameters:
        - {$ref: "#/components/parameters/DraftID"}
        - {$ref: "#/components/parameters/MediaName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Measured"}
      responses:
        "200":
          description: The draft with the measured file.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftChanged"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Remove one media file from a draft.
      description: |
        The manifest keeps what it says; validation then names the file as
        missing, so nothing disappears silently.
      operationId: deleteDraftMedia
      parameters:
        - {$ref: "#/components/parameters/DraftID"}
        - {$ref: "#/components/parameters/MediaName"}
      responses:
        "200":
          description: The draft without the file.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftChanged"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /drafts/{id}/validate:
    post:
      summary: What a publish of this draft would find.
      description: |
        The server builds the manifest with the files table it would write,
        validates it with internal/scenario and answers the problems, the
        same ones the package would have.
      operationId: validateDraft
      parameters: [{$ref: "#/components/parameters/DraftID"}]
      responses:
        "200":
          description: The problems, empty when the draft is ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftProblems"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /drafts/{id}/publish:
    post:
      summary: Write the package of a draft and publish it (D-042).
      description: |
        The server writes manifest.toml from the draft, computes the SHA-256
        of every file into the files table, zips the package, hands it to
        the same chain an upload takes and publishes the version. The
        version is one above the latest published version of the scenario. A
        draft with problems publishes nothing and is answered with 422.
      operationId: publishDraft
      parameters: [{$ref: "#/components/parameters/DraftID"}]
      responses:
        "200":
          description: The published version.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScenarioVersion"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: The draft was not published; code invalid_package, with error.problems.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /scenarios:
    get:
      summary: The catalogue, one entry per scenario (D-036).
      operationId: listScenarios
      responses:
        "200":
          description: The scenarios by id, each with its latest published version and its drafts.
          content:
            application/json:
              schema:
                type: object
                required: [scenarios]
                properties:
                  scenarios:
                    type: array
                    items: {$ref: "#/components/schemas/ScenarioSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      summary: Upload a scenario package; it is validated and kept as a draft (D-037).
      description: |
        The body is multipart/form-data with the zip in the field package,
        at most content.max_upload_mb megabytes. The manifest names the id
        and the version. A version above the latest published one is stored
        as a draft, replacing a draft of the same version; the draft keeps
        its validation problems and cannot be published until an upload
        without problems replaces it. A package that cannot be read, whose
        id or version is unusable, or whose version is published already is
        not stored and answered with 422 and its problems.
      operationId: uploadScenario
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package: {type: string, format: binary}
      responses:
        "201":
          description: A new draft.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        "200":
          description: A draft of the same version was replaced.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          description: The package is larger than the upload limit; code too_large.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: The package was not stored; code invalid_package, with error.problems.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /scenarios/{id}:
    get:
      summary: Every version of a scenario and the devices that hold them.
      operationId: getScenario
      parameters: [{$ref: "#/components/parameters/ScenarioID"}]
      responses:
        "200":
          description: The versions, newest first, with their problems, and the holdings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScenarioDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /scenarios/{id}/{version}:
    delete:
      summary: Delete a draft and its package; a published version stays (D-037).
      operationId: deleteScenario
      parameters:
        - {$ref: "#/components/parameters/ScenarioID"}
        - {$ref: "#/components/parameters/Version"}
      responses:
        "204":
          description: The draft is gone.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ContentConflict"}
  /scenarios/{id}/{version}/publish:
    post:
      summary: Publish a draft; from then on it never changes (D-037).
      description: |
        A draft with problems is refused with has_problems, a published
        version with published, and a draft at or below the latest published
        version with version_taken.
      operationId: publishScenario
      parameters:
        - {$ref: "#/components/parameters/ScenarioID"}
        - {$ref: "#/components/parameters/Version"}
      responses:
        "200":
          description: The published version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScenarioVersion"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ContentConflict"}
  /scenarios/{id}/{version}/package.zip:
    get:
      summary: Download a package exactly as it was uploaded (D-038).
      description: |
        Devices fetch published versions with their device token; admins
        fetch any version. Range requests are answered with 206. The header
        X-Manifest-SHA256 carries the manifest hash, which content_available
        announces.
      operationId: downloadPackage
      security:
        - adminToken: []
        - deviceToken: []
      parameters:
        - {$ref: "#/components/parameters/ScenarioID"}
        - {$ref: "#/components/parameters/Version"}
        - name: Range
          in: header
          schema: {type: string, example: "bytes=1024-"}
      responses:
        "200":
          description: The whole package.
          headers:
            X-Manifest-SHA256:
              schema: {type: string}
          content:
            application/zip:
              schema: {type: string, format: binary}
        "206":
          description: The requested part of the package.
          headers:
            X-Manifest-SHA256:
              schema: {type: string}
            Content-Range:
              schema: {type: string}
          content:
            application/zip:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: The admin token was revoked, or the device is not approved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416":
          description: The range lies outside the package.
  /scenarios/{id}/{version}/cover.png:
    get:
      summary: The cover of a version, for the catalogue.
      operationId: scenarioCover
      parameters:
        - {$ref: "#/components/parameters/ScenarioID"}
        - {$ref: "#/components/parameters/Version"}
      responses:
        "200":
          description: cover.png of the package.
          content:
            image/png:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /rankings:
    get:
      summary: Compute the ranking of a session or of everything (D-023).
      operationId: rankings
      parameters:
        - name: session
          in: query
          description: A session id; empty means all events, in a session or not.
          schema: {type: string}
      responses:
        "200":
          description: The ranking, by points, then hits, then controller id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ranking"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /events:
    get:
      summary: Read the journal, in the order the server received it.
      operationId: events
      parameters:
        - {name: device, in: query, schema: {type: string}}
        - {name: session, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: controller, in: query, schema: {type: string}}
        - {name: from, in: query, description: "ts_server from, inclusive.", schema: {type: integer, minimum: 0}}
        - {name: to, in: query, description: "ts_server to, exclusive.", schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, description: Default 100., schema: {type: integer, minimum: 0, maximum: 1000}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                type: object
                required: [events, limit, offset]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/Event"}
                  limit: {type: integer}
                  offset: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /online:
    get:
      summary: List the devices connected right now.
      operationId: online
      responses:
        "200":
          description: The connected devices, ordered by id.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: {$ref: "#/components/schemas/Online"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /settings:
    get:
      summary: Read every setting with its value, source, range and texts.
      description: |
        The settings come from the registry (D-030) in its order, with the
        label, description and why in the requested language (D-031).
        restart_pending lists the settings whose new value waits for a
        restart (D-032).
      operationId: listSettings
      parameters:
        - name: lang
          in: query
          description: The language of the texts; en when empty.
          schema: {type: string, enum: [en, de]}
      responses:
        "200":
          description: Every setting of the registry.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      summary: Change settings, all or none.
      description: |
        The body maps setting keys to new values. Every value is checked
        through the registry; one refused value refuses the whole change,
        with a field error per setting. Accepted values are written to the
        configuration file the server was started with (D-032); a server
        started without --config creates theserver.toml in its data
        directory with the first change and reads it at every later start
        without --config. Settings that allow it take effect at once, the
        others after a restart. A
        setting that an environment variable or a flag sets cannot be
        changed here. Every change is logged with the admin token, the old
        and the new value (D-033). A value equal to the configured one is
        written but reported as no change.
      operationId: changeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {description: "A string, a number or a boolean, as the kind of the setting needs."}
              example: {"log.level": "debug", "link.ack_batch": 64}
      responses:
        "200":
          description: The changes and what they need.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsChanged"}
        "400": {$ref: "#/components/responses/SettingsRefused"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/FileAppeared"}
  /settings/reset:
    post:
      summary: Set settings back to their defaults, all or none.
      description: The settings are removed from the configuration file, otherwise as PUT /settings.
      operationId: resetSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              additionalProperties: false
              properties:
                keys:
                  type: array
                  items: {type: string}
      responses:
        "200":
          description: The changes and what they need.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsChanged"}
        "400": {$ref: "#/components/responses/SettingsRefused"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/FileAppeared"}
  /openapi.yaml:
    get:
      summary: This document.
      operationId: openAPI
      security: []
      responses:
        "200":
          description: The OpenAPI description of API v1.
          content:
            application/yaml:
              schema: {type: string}
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: An admin token from `theserver admin token add`.
    deviceToken:
      type: http
      scheme: bearer
      description: The token of an approved device, for package downloads only.
  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      schema: {type: string}
    SessionID:
      name: id
      in: path
      required: true
      schema: {type: string}
    ScenarioID:
      name: id
      in: path
      required: true
      schema: {type: string}
    DraftID:
      name: id
      in: path
      required: true
      schema: {type: string}
    MediaName:
      name: name
      in: path
      required: true
      description: The file name in the media directory of the draft.
      schema: {type: string}
    Version:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: No admin token, or an unknown one.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: The admin token was revoked.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: The device, session or endpoint does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: The session exists already, or cannot make this state change.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ContentConflict:
      description: |
        The change conflicts with the scenario content: published, the
        version is published and stays; has_problems, the draft did not
        validate; version_taken, a newer version is published; not_published,
        a draft cannot be assigned; age_rating, the scenario is rated above
        the age a device is set for; bad_transition, the session is no longer
        created.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    SettingsRefused:
      description: One or more settings were refused; error.fields names each with its reason. Nothing was changed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    FileAppeared:
      description: |
        The server started without a configuration file, and a file appeared
        where the first change would create it; code conflict. Restart the
        server to read it.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Draft:
      type: object
      description: One editor draft (D-041).
      required: [id, scenario_id, tier, title, media, created_at, updated_at, problems]
      properties:
        id: {type: string, description: "The id of the draft, not of the scenario."}
        scenario_id: {type: string, description: The id the published scenario gets.}
        tier: {type: string, enum: [video, interactive, layered, realtime]}
        title:
          type: object
          additionalProperties: {type: string}
        manifest:
          type: object
          description: The manifest as the editor changes it; left out in the list.
        media:
          type: array
          items: {$ref: "#/components/schemas/DraftMedia"}
        created_at: {type: integer}
        created_by: {type: string}
        updated_at: {type: integer}
        updated_by: {type: string}
        published_version: {type: integer, description: "The version this draft last published, 0 for none."}
        next_version: {type: integer, description: The version the next publish gets.}
        problems:
          type: array
          items: {$ref: "#/components/schemas/Problem"}
      additionalProperties: false
    DraftMedia:
      type: object
      description: One file in the media directory of a draft.
      required: [name, path, container, codec, size]
      properties:
        name: {type: string}
        path: {type: string, description: Where the file lands in the package.}
        use: {type: string, enum: [clip, overlay, sound, cover], description: What the kind is good for; empty when nothing takes it.}
        container: {type: string}
        codec: {type: string}
        size: {type: integer}
        duration_ms: {type: integer, description: "What the browser measured, 0 until it says."}
        width: {type: integer}
        height: {type: integer}
        uploaded_at: {type: integer}
      additionalProperties: false
    DraftChanged:
      type: object
      required: [draft, touched]
      properties:
        draft: {$ref: "#/components/schemas/Draft"}
        touched:
          type: array
          description: The problems in the parts of the manifest the change named.
          items: {$ref: "#/components/schemas/Problem"}
      additionalProperties: false
    DraftProblems:
      type: object
      required: [problems]
      properties:
        problems:
          type: array
          items: {$ref: "#/components/schemas/Problem"}
      additionalProperties: false
    NewDraft:
      type: object
      properties:
        id: {type: string, description: The id the scenario gets.}
        tier: {type: string, enum: [video, interactive]}
        title:
          type: object
          additionalProperties: {type: string}
        from:
          type: object
          description: The published version to copy.
          required: [id, version]
          properties:
            id: {type: string}
            version: {type: integer, minimum: 1}
          additionalProperties: false
      additionalProperties: false
    Measured:
      type: object
      description: What the browser measured on a clip.
      properties:
        duration_ms: {type: integer, minimum: 0}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, method_not_allowed, conflict, bad_transition, internal, invalid_settings, invalid_package, too_large, published, has_problems, version_taken, not_published, age_rating]
            message: {type: string}
            fields:
              type: array
              description: With invalid_settings, one entry per refused setting.
              items: {$ref: "#/components/schemas/FieldError"}
            problems:
              type: array
              description: With invalid_package, the problems of the package.
              items: {$ref: "#/components/schemas/Problem"}
    FieldError:
      type: object
      required: [key, code, message]
      properties:
        key: {type: string}
        code:
          type: string
          enum: [unknown_setting, out_of_range, not_allowed, bad_address, bad_duration, bad_number, bad_bool, empty, bad_type, overridden, cert_key_pair]
        message: {type: string, description: The reason in English; a page translates the code instead.}
        min: {type: integer}
        max: {type: integer}
        unit: {type: string}
        allowed:
          type: array
          items: {type: string}
        name: {type: string, description: "With overridden, the environment variable or flag that sets the setting."}
    Device:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [target, controller, bridge]}
        class: {type: string, enum: [esp, pi, pc]}
        name: {type: string}
        room: {type: string}
        zone: {type: string}
        status: {type: string, enum: [pending, approved, blocked]}
        firmware_version: {type: string}
        seq_epoch: {type: integer, minimum: 1}
        has_token: {type: boolean}
        first_seen: {type: integer}
        last_seen: {type: integer}
        created_at: {type: integer}
        updated_at: {type: integer}
        online: {type: boolean}
        connected_at: {type: integer, description: 0 while offline.}
        last_ack: {type: integer, description: 0 while offline.}
        min_age: {type: integer, enum: [0, 6, 12, 16, 18], description: The age the device is set for (D-039).}
    NewToken:
      type: object
      properties:
        device_id: {type: string}
        token: {type: string, description: Shown this once.}
        warning: {type: string}
    Session:
      type: object
      properties:
        id: {type: string}
        scenario: {type: string, description: "The id of the assigned scenario, or the label given at creation."}
        scenario_version: {type: integer, description: The assigned version; 0 while none is assigned.}
        room: {type: string}
        state: {type: string, enum: [created, running, stopped]}
        started_at: {type: integer}
        ended_at: {type: integer}
        created_at: {type: integer}
        updated_at: {type: integer}
        devices:
          type: array
          items: {type: string}
    NewSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Letters, digits, dot, dash and underscore, up to 64. Empty lets the server choose.
        scenario: {type: string, description: A label until a scenario version is assigned.}
        room: {type: string}
    SessionDevice:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id: {type: string}
    Problem:
      type: object
      description: One reason a scenario package is not valid (D-040); a page translates the code and shows the detail below it.
      required: [field, code, detail]
      properties:
        field: {type: string, description: "The place in the manifest, such as zone[1].points."}
        code:
          type: string
          enum: [bad_package, no_manifest, bad_manifest, unknown_field, missing_section, bad_id, duplicate_id, bad_version, bad_tier, missing_text, no_age_rating, bad_age_rating, bad_value, no_canvas, bad_shape, keyframes_unordered, bad_time_window, zone_without_appearance, zone_shared, appearance_unknown_zone, appearance_without_zones, unknown_appearance, unknown_media_state, not_in_tier, tier_media_mismatch, missing_media, hash_mismatch, unlisted_file, version_taken]
        detail: {type: string, description: The reason in English.}
    ScenarioVersion:
      type: object
      properties:
        id: {type: string}
        version: {type: integer, minimum: 1}
        tier: {type: string, enum: [video, interactive, layered, realtime]}
        title:
          type: object
          description: The title by language.
          additionalProperties: {type: string}
        age_rating: {type: string, enum: ["0", "6", "12", "16", "18"]}
        manifest_hash: {type: string, description: "SHA-256 of the canonical manifest, lower case hex."}
        size: {type: integer, description: Bytes of the package as uploaded.}
        status: {type: string, enum: [draft, published]}
        uploaded_at: {type: integer}
        uploaded_by: {type: string, description: The name of the admin token.}
        published_at: {type: integer, description: 0 for a draft.}
        problems:
          type: array
          description: The validation problems of a draft; a published version has none.
          items: {$ref: "#/components/schemas/Problem"}
    ScenarioSummary:
      type: object
      properties:
        id: {type: string}
        current:
          description: The latest published version, else the newest draft.
          allOf: [{$ref: "#/components/schemas/ScenarioVersion"}]
        latest:
          description: The latest published version; null while none is published.
          anyOf: [{$ref: "#/components/schemas/ScenarioVersion"}, {type: "null"}]
        drafts:
          type: array
          items: {$ref: "#/components/schemas/ScenarioVersion"}
    ScenarioDetail:
      type: object
      properties:
        id: {type: string}
        latest: {type: integer, description: The latest published version; 0 while none is published.}
        versions:
          type: array
          items: {$ref: "#/components/schemas/ScenarioVersion"}
        holdings:
          type: array
          items: {$ref: "#/components/schemas/Holding"}
    Holding:
      type: object
      properties:
        device_id: {type: string}
        scenario_id: {type: string}
        version: {type: integer}
        installed_at: {type: integer, description: When the version last became current on the device.}
        current: {type: boolean, description: The latest report of the device includes the version.}
        latest: {type: integer, description: The latest published version of the scenario; 0 while none is published.}
    Upload:
      type: object
      properties:
        replaced: {type: boolean}
        scenario: {$ref: "#/components/schemas/ScenarioVersion"}
        problems:
          type: array
          items: {$ref: "#/components/schemas/Problem"}
    ScenarioAssignment:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: {type: string}
        version: {type: integer, minimum: 1}
    SessionAssignment:
      type: object
      properties:
        session: {$ref: "#/components/schemas/Session"}
        announcements:
          type: array
          items: {$ref: "#/components/schemas/Announcement"}
    Announcement:
      type: object
      properties:
        device_id: {type: string}
        session_id: {type: string}
        scenario_id: {type: string}
        version: {type: integer}
        state:
          type: string
          enum: [announced, waiting, failed]
          description: announced, the device took content_available; waiting, the device is offline and hears of it on its next connection; failed, see error.
        error: {type: string}
    DeviceScenarios:
      type: object
      properties:
        device_id: {type: string}
        min_age: {type: integer}
        holdings:
          type: array
          items: {$ref: "#/components/schemas/Holding"}
        assignments:
          type: array
          items:
            type: object
            properties:
              session_id: {type: string}
              state: {type: string, enum: [created, running]}
              scenario_id: {type: string}
              version: {type: integer}
              installed: {type: boolean, description: The device holds this version now.}
    MinAge:
      type: object
      additionalProperties: false
      required: [min_age]
      properties:
        min_age: {type: integer, enum: [0, 6, 12, 16, 18]}
    RankingEntry:
      type: object
      properties:
        controller_id: {type: string}
        hits: {type: integer}
        misses: {type: integer}
        points: {type: integer}
        last_hit: {type: integer, description: "Device time of the latest hit, 0 without one."}
    Ranking:
      type: object
      properties:
        session: {type: string}
        computed_at: {type: integer}
        entries:
          type: array
          items: {$ref: "#/components/schemas/RankingEntry"}
    Event:
      type: object
      properties:
        id: {type: string, description: The event UUID in text form.}
        device_id: {type: string}
        seq_epoch: {type: integer}
        seq: {type: integer}
        kind: {type: string}
        controller_id: {type: string}
        session_id: {type: string}
        ts_device: {type: integer}
        ts_server: {type: integer}
        payload: {type: string, format: byte, description: "The CBOR d map as the device sent it, base64."}
    Online:
      type: object
      properties:
        device_id: {type: string}
        remote_addr: {type: string}
        connected_at: {type: integer}
        last_event_at: {type: integer}
        last_ack: {type: integer}
    Setting:
      type: object
      properties:
        key: {type: string, description: section.key as in the TOML file.}
        section: {type: string}
        kind: {type: string, enum: [string, int, bool, duration, enum, path, addr]}
        value: {description: "The value in effect, a string, an integer or a boolean."}
        default: {description: The built in default.}
        source: {type: string, enum: [default, file, env, flag]}
        pending: {description: The value after the next restart; only present while one waits.}
        unit: {type: string, description: "The unit of a duration, such as ms, s or h."}
        min: {type: integer}
        max: {type: integer}
        enum:
          type: array
          items: {type: string}
        empty: {type: boolean, description: An empty value is allowed.}
        restart: {type: boolean, description: A change takes effect after a restart.}
        env: {type: string}
        flag: {type: string}
        label: {type: string}
        description: {type: string}
        why: {type: string}
    SettingsList:
      type: object
      required: [language, file, file_exists, restart_pending, settings]
      properties:
        language: {type: string}
        file: {type: string, description: The configuration file changes are written to.}
        file_exists:
          type: boolean
          description: False for a server started without --config until the first change creates the file.
        restart_pending:
          type: array
          items: {type: string}
        settings:
          type: array
          items: {$ref: "#/components/schemas/Setting"}
    SettingsChanged:
      type: object
      required: [changes, applied, restart_pending]
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              old: {description: The value configured before.}
              new: {description: The value configured now.}
              restart: {type: boolean}
        applied:
          type: array
          description: The settings that took effect at once.
          items: {type: string}
        restart_pending:
          type: array
          description: Every setting that waits for a restart.
          items: {type: string}
