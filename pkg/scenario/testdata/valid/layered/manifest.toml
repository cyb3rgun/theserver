# Scenario fixture: a valid LAYERED package (docs/scenario.md, version 1).
# The media files are placeholders; theserver checks presence and hash.

[scenario]
id          = "dark-alley"
version     = 1
tier        = "layered"
title       = { en = "Dark Alley", de = "Dunkle Gasse" }
description = { en = "A zombie and a dog before a running background.", de = "Ein Zombie und ein Hund vor einem laufenden Hintergrund." }
age_rating  = "18"
duration_s  = 20
author      = "CYB3RGUN"
licence     = "official"

[display]
canvas      = { w = 1080, h = 1920 }
orientation = "portrait"
fit         = "cover"

[rules]
points_per_hit_default = 50
miss_penalty           = 0
timeout_counts_as_hit  = true
timeout_penalty        = 100
lives                  = 3
score_cap              = 0

[[zone]]
id           = "z-head"
name         = { en = "Head", de = "Kopf" }
shape        = "polygon"
points       = [[520, 300], [600, 300], [600, 420], [520, 420]]
points_value = 100
zone_class   = "head"

[[zone.keyframe]]
t_ms   = 3000
points = [[520, 300], [600, 300], [600, 420], [520, 420]]

[[zone.keyframe]]
t_ms   = 5000
points = [[560, 310], [640, 310], [640, 430], [560, 430]]

[[zone]]
id           = "z-torso"
name         = { en = "Torso", de = "Rumpf" }
shape        = "rect"
points       = [[480, 420], [660, 800]]
points_value = 50
zone_class   = "torso"

[[zone]]
id           = "z-dog"
name         = { en = "Dog", de = "Hund" }
shape        = "circle"
points       = [[300, 1500]]
radius       = 90
zone_class   = "torso"

[[zone.keyframe]]
t_ms   = 9000
points = [[300, 1500]]
radius = 90

[[zone.keyframe]]
t_ms   = 12000
points = [[420, 1520]]
radius = 90

[[appearance]]
id            = "a-zombie-1"
t_start_ms    = 3000
t_end_ms      = 6000
zones         = ["z-head", "z-torso"]
required_hits = 1
on_timeout    = "penalty"
layer         = "zombie"
media_state   = "walk"

[[appearance]]
id            = "a-dog-1"
t_start_ms    = 9000
t_end_ms      = 13000
zones         = ["z-dog"]
required_hits = 2
on_timeout    = "nothing"
layer         = "dog"
media_state   = "run"

[reaction.immediate]
flash        = true
impact_sound = "media/impact.ogg"
hitmarker    = "ring"
blood        = "media/blood-1.webm"

[[reaction.followup]]
appearance  = "a-zombie-1"
zone_class  = "head"
media_state = "die-head"
duration_ms = 1800
then        = "end"

[[reaction.followup]]
appearance  = "a-dog-1"
zone_class  = "torso"
media_state = "flee"
duration_ms = 1200
then        = "end"

[media.background]
clip = "media/alley-bg.mp4"

[media.layer.zombie]
states = { walk = "media/zombie-walk.webm", die-head = "media/zombie-die-head.webm" }
z      = 10

[media.layer.dog]
states = { run = "media/dog-run.webm", flee = "media/dog-flee.webm" }
z      = 20

