{{define "content"}}
<section class="login">
  <h1>{{t "admin.login.title"}}</h1>
  <p>{{t "admin.login.intro"}} <code>theserver admin token add --name &lt;name&gt;</code>.</p>
  {{template "messages" .}}
  <form method="post" action="/admin/login">
    <label for="token">{{t "admin.login.token"}}</label>
    <input id="token" name="token" type="password" autocomplete="off" required>
    <button class="button primary" type="submit">{{t "admin.login.submit"}}</button>
  </form>
  <p class="muted">{{t "admin.login.lasts" .SessionHours}}</p>
</section>
{{end}}
